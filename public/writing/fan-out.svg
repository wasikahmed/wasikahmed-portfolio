<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Fan-in versus fan-out: per-viewer polling multiplies upstream API calls, while one scheduled fetch pushed to all clients does not."><rect width="1200" height="600" fill="#0a0e0c"/><defs>
<marker id="a0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#31463f"/></marker>
<marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#14b8a6"/></marker>
</defs><line x1="600" y1="60" x2="600" y2="560" stroke="#1b2a25" stroke-width="1"/><text x="48" y="46" fill="#93a49c" font-family="ui-monospace,Menlo,monospace" font-size="12" letter-spacing="2">FAN-IN — ONE CALL PER VIEWER</text><text x="648" y="46" fill="#5eead4" font-family="ui-monospace,Menlo,monospace" font-size="12" letter-spacing="2">FAN-OUT — ONE CALL PER INTERVAL</text><rect x="185" y="90" width="190" height="52" rx="6" fill="#131c17" stroke="#1b2a25" stroke-width="1"/><text x="280.0" y="113.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">Paid sports API</text><text x="280.0" y="131.0" fill="#82928a" font-family="ui-monospace,Menlo,monospace" font-size="11" text-anchor="middle">billed per call</text><rect x="185" y="300" width="190" height="52" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="280.0" y="331.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">Backend</text><rect x="60" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="112.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><rect x="185" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="237.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><rect x="310" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="362.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><rect x="435" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="487.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><line x1="112" y1="468" x2="280" y2="356" stroke="#31463f" stroke-width="1.5" marker-end="url(#a0)"/><line x1="237" y1="468" x2="280" y2="356" stroke="#31463f" stroke-width="1.5" marker-end="url(#a0)"/><line x1="362" y1="468" x2="280" y2="356" stroke="#31463f" stroke-width="1.5" marker-end="url(#a0)"/><line x1="487" y1="468" x2="280" y2="356" stroke="#31463f" stroke-width="1.5" marker-end="url(#a0)"/><line x1="280" y1="298" x2="280" y2="146" stroke="#31463f" stroke-width="1.5" marker-end="url(#a0)"/><text x="298" y="230" fill="#e06c6c" font-family="ui-monospace,Menlo,monospace" font-size="15">× 4 calls</text><text x="298" y="252" fill="#82928a" font-family="ui-monospace,Menlo,monospace" font-size="11">× 4 000 viewers …</text><text x="48" y="560" fill="#93a49c" font-family="ui-monospace,Menlo,monospace" font-size="12">Cost scales with how many people are watching.</text><rect x="785" y="90" width="190" height="52" rx="6" fill="#131c17" stroke="#1b2a25" stroke-width="1"/><text x="880.0" y="113.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">Paid sports API</text><text x="880.0" y="131.0" fill="#82928a" font-family="ui-monospace,Menlo,monospace" font-size="11" text-anchor="middle">billed per call</text><rect x="785" y="300" width="190" height="52" rx="6" fill="#0f1410" stroke="#14b8a6" stroke-width="1"/><text x="880.0" y="331.0" fill="#5eead4" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">Backend</text><rect x="660" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="712.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><rect x="785" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="837.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><rect x="910" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="962.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><rect x="1035" y="470" width="105" height="40" rx="6" fill="#0f1410" stroke="#1b2a25" stroke-width="1"/><text x="1087.5" y="495.0" fill="#eaf2ed" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">client</text><rect x="785" y="195" width="190" height="44" rx="6" fill="#0f1410" stroke="#14b8a6" stroke-width="1"/><text x="880.0" y="214.0" fill="#5eead4" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">Celery beat</text><text x="880.0" y="232.0" fill="#82928a" font-family="ui-monospace,Menlo,monospace" font-size="11" text-anchor="middle">every 15s</text><line x1="880" y1="193" x2="880" y2="148" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#a1)"/><line x1="880" y1="241" x2="880" y2="298" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#a1)"/><text x="990" y="122" fill="#5eead4" font-family="ui-monospace,Menlo,monospace" font-size="15">1 call</text><line x1="880" y1="356" x2="712" y2="466" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#a1)"/><line x1="880" y1="356" x2="837" y2="466" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#a1)"/><line x1="880" y1="356" x2="962" y2="466" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#a1)"/><line x1="880" y1="356" x2="1087" y2="466" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#a1)"/><text x="648" y="560" fill="#93a49c" font-family="ui-monospace,Menlo,monospace" font-size="12">Cost scales with how many matches are live.</text><text x="1008" y="424" fill="#14b8a6" font-family="ui-monospace,Menlo,monospace" font-size="12">push</text></svg>