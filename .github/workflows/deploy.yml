name: Build and deploy

# --------------------------------------------------------------------------
# `verify` gates `build-and-push`: typecheck, lint, format:check, unit tests,
# build. Re-added 2026-08-30 (PLAN.md W4) after being removed once for
# costing ~3 minutes per deploy — that cost is worth it now that CI is the
# only thing standing between a push and production. E2E is deliberately
# NOT in this path (see e2e.yml) so a slow browser suite never gates a
# hotfix; this job trusts `pnpm e2e` was run locally per AGENTS.md, or
# recently by the scheduled e2e.yml run.
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# Production is the Hostinger Docker Manager project "wasikahmed-portfolio"
# in /docker/wasikahmed-portfolio on the Advergo VPS. This workflow builds
# the image, pushes it to Docker Hub, copies docker-compose.prod.yml there
# (as docker-compose.yml) with the image pinned to this exact build, and
# runs ops/deploy.sh. It never writes the server's .env: runtime settings
# live in the panel's Environment box and never pass through GitHub.
#
# Repository secrets it reads (Settings → Secrets and variables → Actions),
# the same names every repo on that VPS uses:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   Docker Hub login for the push
#   VPS_HOST, VPS_SSH_PORT                where the VPS's SSH listens
#   VPS_SSH_USER, VPS_SSH_KEY             root and the shared deploy key
# --------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: itzwasik/portfolio
  PROJECT_DIR: /docker/wasikahmed-portfolio
  HEALTH_URL: http://127.0.0.1:5000/api/health

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The mongod binary mongodb-memory-server downloads for `pnpm test`
      # (~75MB; its postinstall is off, see pnpm-workspace.yaml). Keyed on
      # the lockfile because the package version picks the default mongod
      # version. A miss is only slower: vitest.global-setup.ts downloads it
      # once before any test file runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: pnpm test
      # generateStaticParams() catches the unreachable-DB case by design
      # (see the Dockerfile's comment) — no MONGODB_URI needed here either.
      - run: pnpm build

  build-and-push:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Must match the VPS's CPU architecture — @node-rs/argon2's
          # prebuilt native binary is resolved per-platform at `pnpm
          # install` time inside the build, so a mismatched platform here
          # produces an image that fails at runtime, not at build time.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    # No automatic rollback: ops/deploy.sh fails the job if the new build
    # never goes healthy, and the previous compose file stays on the server
    # as backups/docker-compose.previous.yml (AGENTS.md §10 has how to roll
    # back).
    steps:
      - uses: actions/checkout@v4

      # The server's compose file names the exact build, so the panel shows
      # what is running and a rollback is just the previous tag.
      - name: Prepare the release files
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          mkdir -p out
          sed "s#^\([[:space:]]*image: ${IMAGE}:\).*#\1${TAG}#" docker-compose.prod.yml > out/docker-compose.yml
          grep -q "image: ${IMAGE}:${TAG}" out/docker-compose.yml
          cp ops/deploy.sh out/

      # Connections from GitHub to the VPS occasionally time out; wait for
      # SSH to answer instead of failing the deploy on a network blip.
      - name: Wait for SSH on the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          for _ in $(seq 1 12); do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then echo "SSH reachable"; exit 0; fi
            sleep 10
          done
          echo "::error::the VPS did not accept connections on its SSH port for 2 minutes"; exit 1

      - name: Copy the release files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'out/docker-compose.yml,out/deploy.sh'
          target: /tmp/wasikahmed-portfolio-release
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The action reports only the last command's exit status, so keep
          # deploy.sh's and exit with it after cleaning up; otherwise a
          # failed deploy shows as a success.
          script: |
            bash /tmp/wasikahmed-portfolio-release/deploy.sh ${{ env.PROJECT_DIR }} \
              /tmp/wasikahmed-portfolio-release/docker-compose.yml \
              ${{ needs.build-and-push.outputs.tag }} ${{ env.HEALTH_URL }}
            rc=$?
            rm -rf /tmp/wasikahmed-portfolio-release
            exit $rc
