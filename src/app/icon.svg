<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Brand mark. Geometry mirrors MARK_PATH / MARK_NODES in src/lib/brand.ts and
    uses the MARK_SMALL weights, because this renders at 16px in the tab strip
    where the default hairline disappears.

    The hex is literal by necessity — a static asset cannot read a Tailwind
    @theme token. Keep in sync with the accent ramp in src/app/globals.css.

    The filled tile is not decoration: it guarantees the accent green sits on
    its intended ground even when the browser chrome is light.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0e0c" />
  <path
    d="M5 9 L11.5 23 L16 14 L20.5 23 L27 9"
    fill="none"
    stroke="#0fbf7a"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="5" cy="9" r="3.4" fill="#0fbf7a" />
  <circle cx="11.5" cy="23" r="3.4" fill="#0fbf7a" />
  <circle cx="16" cy="14" r="3.4" fill="#0fbf7a" />
  <circle cx="20.5" cy="23" r="3.4" fill="#0fbf7a" />
  <circle cx="27" cy="9" r="3.4" fill="#7ce86a" />
</svg>
