<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Favicon. The tile variant, not the bracket mark: geometry mirrors
    TILE_LETTER / TILE_RADIUS in src/lib/brand.ts.

    A filled tile rather than the outline mark, because this renders at 16px in
    a tab strip where a three-element hairline glyph disappears. It also carries
    its own ground, so the mark never lands accent-on-white when the browser
    chrome is light — which the outline version does.

    The hex is literal by necessity — a static asset cannot read a Tailwind
    @theme token. Keep in sync with the accent ramp in src/app/globals.css.
  -->
  <rect width="32" height="32" rx="7.5" fill="#14b8a6" />
  <path
    d="M6.5 9 L11.9 23.6 L16 13.4 L20.1 23.6 L25.5 9"
    fill="none"
    stroke="#0a0e0c"
    stroke-width="3.1"
    stroke-linecap="square"
    stroke-linejoin="round"
  />
</svg>
