# Development stack, driven by `docker compose watch`.
# Production compose (Cloudflare Tunnel topology, backups) is Phase 7 —
# see PLAN.md §4. Mongo here runs without auth, a named volume, and its
# port published to the host — fine for a local-only dev database, not
# how it runs in production.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # Host 3300, not 3000 — this machine already has another project's
      # container bound to 3000. Override with PORT_HOST=xxxx if 3300 is
      # also taken.
      - '${PORT_HOST:-3300}:3000'
    # Everything in .env (AUTH_SECRET, ADMIN_EMAIL, and future Resend/
    # Turnstile keys) flows into the container automatically — new secrets
    # never need a matching line added here.
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: '3000'
      # Service name, not localhost — web reaches mongo over the compose
      # network. A bare `pnpm build`/`pnpm dev` run on the host instead
      # uses .env's MONGODB_URI (localhost, via the published port below).
      MONGODB_URI: mongodb://mongo:27017/portfolio
      # Next's dev-resource origin check (see next.config.ts) — the browser
      # reaches the container as localhost, which is already the default
      # allowed origin, but WATCHPACK_POLLING below is what actually makes
      # file-change detection reliable across the VM boundary docker uses
      # on macOS/Windows.
      WATCHPACK_POLLING: 'true'
    volumes:
      # Uploaded media survives container recreation. Also bind-mountable
      # to the host if you want to browse/back up files directly — not
      # done by default since it isn't needed for the dev workflow.
      - media-uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
    develop:
      watch:
        # Source, content, and tests: synced straight into the running
        # container. Turbopack's own watcher (backed by polling, above)
        # picks up the change and hot-reloads — no container restart.
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./e2e
          target: /app/e2e
        - action: sync
          path: ./scripts
          target: /app/scripts

        # Config that Next only reads at boot: sync the file, then restart
        # the dev server so the new config actually takes effect.
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs

        # Dependency manifests: rebuild the image so `pnpm install` reruns
        # inside the cached layer rather than drifting from node_modules.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  mongo:
    image: mongo:7
    ports:
      # Published so host-side `pnpm build`/`pnpm dev`/`pnpm seed` can
      # reach it too, not only the web container.
      - '${MONGO_PORT_HOST:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      # A generous window: mongo's first start on a fresh volume, especially
      # on a machine under load (a concurrent image build, another Next.js
      # build), can take longer than a quick healthcheck expects. Getting
      # marked unhealthy here isn't just cosmetic — `web` depends on
      # service_healthy and `docker compose watch` does not retry that wait,
      # it fails outright.
      retries: 20
      start_period: 40s

  mongo-express:
    image: mongo-express:1
    ports:
      - '${MONGO_EXPRESS_PORT_HOST:-8081}:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  media-uploads:
